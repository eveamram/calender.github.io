name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Publish built assets for branch Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf assets
          mkdir -p assets
          cp -R dist/assets/. assets/
          # Keep previous app.js/app.css URLs working for cached phone/computer pages.
          if [ -f assets/app-v8.js ]; then cp assets/app-v8.js assets/app.js; fi
          if [ -f assets/app-v8.js.map ]; then cp assets/app-v8.js.map assets/app.js.map; fi
          if [ -f assets/app-v8.css ]; then cp assets/app-v8.css assets/app.css; fi
          git add assets
          if git diff --staged --quiet; then
            echo "assets unchanged"
          else
            git commit -m "deploy assets [skip ci]"
            git push
          fi

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
