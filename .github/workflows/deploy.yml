name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Publish built assets for branch Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf assets
          mkdir -p assets
          cp -R dist/assets/. assets/
          # Keep previous app.js/app.css URLs working for cached phone/computer pages.
          LATEST_JS=$(ls assets/app-v*.js 2>/dev/null | sort -V | tail -1)
          LATEST_CSS=$(ls assets/app-v*.css 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST_JS" ]; then
            cp "$LATEST_JS" assets/app.js
            cp "$LATEST_JS" assets/app-v7.js
            cp "$LATEST_JS" assets/app-v8.js
            cp "$LATEST_JS" assets/app-v9.js
            cp "$LATEST_JS" assets/app-v10.js
            cp "$LATEST_JS" assets/app-v11.js
            cp "$LATEST_JS" assets/app-v24.js
            cp "$LATEST_JS" assets/app-v25.js
            cp "$LATEST_JS" assets/app-v26.js
            cp "$LATEST_JS" assets/app-v27.js
            cp "$LATEST_JS" assets/app-v28.js
          fi
          if [ -f "${LATEST_JS}.map" ]; then
            cp "${LATEST_JS}.map" assets/app.js.map
            cp "${LATEST_JS}.map" assets/app-v7.js.map
            cp "${LATEST_JS}.map" assets/app-v8.js.map
            cp "${LATEST_JS}.map" assets/app-v9.js.map
            cp "${LATEST_JS}.map" assets/app-v10.js.map
            cp "${LATEST_JS}.map" assets/app-v11.js.map
            cp "${LATEST_JS}.map" assets/app-v24.js.map
            cp "${LATEST_JS}.map" assets/app-v25.js.map
            cp "${LATEST_JS}.map" assets/app-v26.js.map
            cp "${LATEST_JS}.map" assets/app-v27.js.map
            cp "${LATEST_JS}.map" assets/app-v28.js.map
          fi
          if [ -n "$LATEST_CSS" ]; then
            cp "$LATEST_CSS" assets/app.css
            cp "$LATEST_CSS" assets/app-v7.css
            cp "$LATEST_CSS" assets/app-v8.css
            cp "$LATEST_CSS" assets/app-v9.css
            cp "$LATEST_CSS" assets/app-v10.css
            cp "$LATEST_CSS" assets/app-v11.css
            cp "$LATEST_CSS" assets/app-v24.css
            cp "$LATEST_CSS" assets/app-v25.css
            cp "$LATEST_CSS" assets/app-v26.css
            cp "$LATEST_CSS" assets/app-v27.css
            cp "$LATEST_CSS" assets/app-v28.css
          fi
          git add assets
          if git diff --staged --quiet; then
            echo "assets unchanged"
          else
            git commit -m "deploy assets [skip ci]"
            git push
          fi

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
