          'tsk-1787439097233-tgyqw': 1,
          'tsk-1787440158272-6ko41': 1,
          'tsk-1787587530334-wn7mk': 1,
          'tsk-1787616192331-htk1c': 1
        };
        try {
          var keys = Object.keys(localStorage);
          for (var i = 0; i < keys.length; i++) {
            var key = keys[i];
            if (key.indexOf('calender_app_table') !== 0) continue;
            if (key.indexOf('calender_app_table_v6_') !== 0) {
              localStorage.removeItem(key);
              continue;
            }
            var raw = localStorage.getItem(key);
            if (!raw) continue;
            var parsed = JSON.parse(raw);
            if (!Array.isArray(parsed)) continue;
            localStorage.setItem(key, JSON.stringify(parsed.filter(function (item) {
              return !item || !item.id || !retired[item.id];
            })));
          }
        } catch (e) {}
      })();
    </script>
